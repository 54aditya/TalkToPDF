services:
  mongodb:
    image: mongo:6.0
    container_name: voice_rag_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - voice_rag_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - voice_rag_net

  redis:
    image: redis:7.0-alpine
    container_name: voice_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voice_rag_net

  backend:
    image: voice_rag_backend:latest
    build: ./backend
    container_name: voice_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/workspace/uploads
    volumes:
      - backend_uploads:/workspace/uploads
    depends_on:
      - mongodb
      - qdrant
      - redis
    networks:
      - voice_rag_net

  celery_worker:
    image: voice_rag_backend:latest
    container_name: voice_rag_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/workspace/uploads
    volumes:
      - backend_uploads:/workspace/uploads
    depends_on:
      - redis
      - mongodb
      - qdrant
    networks:
      - voice_rag_net

  frontend:
    build: ./frontend
    container_name: voice_rag_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - voice_rag_net

volumes:
  mongodb_data:
  qdrant_data:
  redis_data:
  backend_uploads:

networks:
  voice_rag_net:
    driver: bridge
