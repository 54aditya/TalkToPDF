version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: voice_rag_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - voice_rag_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - voice_rag_net

  redis:
    image: redis:7.0-alpine
    container_name: voice_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voice_rag_net

volumes:
  mongodb_data:
  qdrant_data:
  redis_data:

networks:
  voice_rag_net:
    driver: bridge
